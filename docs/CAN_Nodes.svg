<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-label="LPC2129 CAN Based Vehicle Monitoring System Block Diagram">
  <title>LPC2129 CAN Based Vehicle Monitoring System</title>
  
  <defs>
    <!-- Sharp vector arrowheads -->
    <marker id="arrow-blk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#000000"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#cc0000"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>

  <!-- ======================== CAN BUS TRUNK (MIDDLE) ======================== -->
  <!-- Bus Lines -->
  <line x1="60" y1="440" x2="1340" y2="440" stroke="#000" stroke-width="2.5"/>
  <line x1="60" y1="510" x2="1340" y2="510" stroke="#000" stroke-width="2.5"/>
  
  <!-- Termination Resistors (RT = 120 Ohm) -->
  <!-- Left RT -->
  <polyline points="60,440 60,455 52,460 68,470 52,480 68,490 60,495 60,510" fill="none" stroke="#000" stroke-width="2"/>
  <text x="24" y="480" font-family="Times New Roman, serif" font-size="16" font-weight="bold">RT</text>
  <!-- Right RT -->
  <polyline points="1340,440 1340,455 1332,460 1348,470 1332,480 1348,490 1340,495 1340,510" fill="none" stroke="#000" stroke-width="2"/>
  <text x="1352" y="480" font-family="Times New Roman, serif" font-size="16" font-weight="bold">RT</text>

  <!-- CAN Labels -->
  <text x="90" y="432" font-family="Times New Roman, serif" font-size="16" font-weight="bold">CANH</text>
  <text x="90" y="528" font-family="Times New Roman, serif" font-size="16" font-weight="bold">CANL</text>
  <text x="1240" y="432" font-family="Times New Roman, serif" font-size="16" font-weight="bold">CANH</text>
  <text x="1240" y="528" font-family="Times New Roman, serif" font-size="16" font-weight="bold">CANL</text>
  
  <text x="440" y="482" font-family="Times New Roman, serif" font-size="22" font-weight="bold" letter-spacing="2">CAN BUS</text>
  <text x="920" y="482" font-family="Times New Roman, serif" font-size="22" font-weight="bold" letter-spacing="2">CAN BUS</text>


  <!-- ======================== 1. MAIN NODE (TOP) ======================== -->
  <text x="700" y="28" font-family="Times New Roman, serif" font-size="20" font-weight="bold" text-anchor="middle">MAIN NODE</text>
  <rect x="360" y="38" width="760" height="360" fill="#fff" stroke="#000" stroke-width="2.5"/>

  <!-- LPC2129 Core -->
  <rect x="680" y="88" width="120" height="280" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <g font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="740" y="120">L</text><text x="740" y="145">P</text><text x="740" y="170">C</text>
    <text x="740" y="195">2</text><text x="740" y="220">1</text><text x="740" y="245">2</text><text x="740" y="270">9</text>
  </g>

  <!-- CAN Controller Block (CC) -->
  <rect x="682" y="285" width="30" height="48" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="697" y="306" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">C</text>
  <text x="697" y="324" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">C</text>

  <!-- External Interrupts Block (EINT) -->
  <rect x="768" y="250" width="30" height="110" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <g font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="783" y="274">E</text><text x="783" y="298">I</text><text x="783" y="322">N</text><text x="783" y="346">T</text>
  </g>

  <!-- MCP2551 Transceiver -->
  <rect x="490" y="225" width="110" height="52" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="545" y="257" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">MCP2551</text>
  
  <!-- Controller to Transceiver (Tx/Rx Bidirectional) -->
  <line x1="600" y1="245" x2="680" y2="295" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>
  <line x1="680" y1="315" x2="600" y2="265" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- On-Chip CAN Controller label -->
  <text x="610" y="165" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">ON-CHIP CAN</text>
  <text x="610" y="182" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">CONTROLLER</text>
  <line x1="645" y1="188" x2="685" y2="280" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-blk)"/>

  <!-- Main Node CAN Bus Drop-lines (MCP2551 -> CANH / CANL) -->
  <line x1="525" y1="277" x2="525" y2="440" stroke="#cc0000" stroke-width="1.8"/>
  <line x1="555" y1="277" x2="555" y2="510" stroke="#cc0000" stroke-width="1.8"/>

  <!-- BUZZER (Output from LPC2129) -->
  <rect x="520" y="100" width="90" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="565" y="131" font-family="Times New Roman, serif" font-size="15" font-weight="bold" text-anchor="middle">BUZZER</text>
  <line x1="680" y1="125" x2="612" y2="125" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- LCD (Output from LPC2129) -->
  <rect x="880" y="100" width="130" height="56" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="945" y="135" font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle">LCD</text>
  <line x1="800" y1="128" x2="878" y2="128" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- DS18B20 Temp Sensor (Bidirectional 1-Wire) -->
  <rect x="895" y="180" width="90" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="940" y="213" font-family="Times New Roman, serif" font-size="15" font-weight="bold" text-anchor="middle">DS18B20</text>
  <line x1="800" y1="200" x2="893" y2="200" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>
  <line x1="895" y1="214" x2="802" y2="214" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- SWITCHES (Input to LPC2129 EINT) -->
  <rect x="875" y="248" width="85" height="34" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="917" y="271" font-family="Times New Roman, serif" font-size="15" font-weight="bold" text-anchor="middle">SW</text>
  <line x1="875" y1="265" x2="800" y2="265" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <rect x="875" y="290" width="85" height="32" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="917" y="312" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">L.I SW</text>
  <line x1="875" y1="306" x2="800" y2="306" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <rect x="875" y="330" width="85" height="32" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="917" y="352" font-family="Times New Roman, serif" font-size="14" font-weight="bold" text-anchor="middle">R.I SW</text>
  <line x1="875" y1="346" x2="800" y2="346" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- Red Annotations for Switches -->
  <g fill="#cc0000" font-family="Times New Roman, serif" font-size="14" font-weight="bold">
    <text x="1130" y="215">MODE SELECTION SWITCH</text>
    <text x="1130" y="235">(FORWARD/BACKWARD)</text>
    <line x1="1125" y1="225" x2="962" y2="262" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <line x1="1125" y1="235" x2="962" y2="305" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  </g>


  <!-- ==================== 2. INDICATOR & REVERSE ALERT NODE (BOTTOM LEFT) ==================== -->
  <rect x="68" y="560" width="554" height="380" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="345" y="970" font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle">INDICATOR NODE &amp; REVERSE ALERT NODE</text>

  <!-- LPC2129 Core -->
  <rect x="290" y="610" width="115" height="240" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <g font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="347" y="640">L</text><text x="347" y="665">P</text><text x="347" y="690">C</text>
    <text x="347" y="715">2</text><text x="347" y="740">1</text><text x="347" y="765">2</text><text x="347" y="790">9</text>
  </g>

  <!-- CC Box -->
  <rect x="292" y="805" width="28" height="42" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="306" y="822" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>
  <text x="306" y="838" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>

  <!-- On-Chip Controller Label -->
  <text x="215" y="695" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">ON-CHIP CAN</text>
  <text x="215" y="712" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">CONTROLLER</text>
  <line x1="250" y1="718" x2="295" y2="800" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-blk)"/>

  <!-- MCP2551 Transceiver -->
  <rect x="90" y="750" width="125" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="152" y="783" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">MCP2551</text>
  <line x1="215" y1="768" x2="290" y2="815" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>
  <line x1="290" y1="835" x2="217" y2="788" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- Transceiver to CAN Bus Drop Lines -->
  <line x1="130" y1="750" x2="130" y2="440" stroke="#cc0000" stroke-width="1.8"/>
  <line x1="160" y1="750" x2="160" y2="510" stroke="#cc0000" stroke-width="1.8"/>

  <!-- 8 LEDs (Output from LPC2129) -->
  <rect x="475" y="625" width="115" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="532" y="649" font-family="Times New Roman, serif" font-size="15" font-weight="bold" text-anchor="middle">8 LEDs</text>
  <text x="532" y="668" font-family="Times New Roman, serif" font-size="12" text-anchor="middle">(INDICATORS)</text>
  <line x1="405" y1="652" x2="473" y2="652" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- Ultrasonic Sensor (Bidirectional Trigger/Echo) -->
  <rect x="465" y="760" width="135" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="532" y="782" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">Ultrasonic</text>
  <text x="532" y="800" font-family="Times New Roman, serif" font-size="12" text-anchor="middle">Sensor (HC-SR04)</text>
  <!-- Trigger -->
  <line x1="405" y1="775" x2="463" y2="775" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>
  <!-- Echo -->
  <line x1="465" y1="795" x2="407" y2="795" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- Footnote -->
  <g font-family="Times New Roman, serif" font-size="12" font-weight="bold">
    <text x="90" y="898">LEFT INDICATION: LED'S SCROLL ONE BY ONE FROM RIGHT TO LEFT</text>
    <text x="90" y="918">RIGHT INDICATION: LED'S SCROLL ONE BY ONE FROM LEFT TO RIGHT</text>
  </g>


  <!-- ==================== 3. FUEL NODE (BOTTOM RIGHT) ==================== -->
  <rect x="758" y="560" width="556" height="380" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="1036" y="970" font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle">FUEL NODE</text>

  <!-- LPC2129 Core -->
  <rect x="990" y="610" width="115" height="240" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <g font-family="Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="1047" y="640">L</text><text x="1047" y="665">P</text><text x="1047" y="690">C</text>
    <text x="1047" y="715">2</text><text x="1047" y="740">1</text><text x="1047" y="765">2</text><text x="1047" y="790">9</text>
  </g>

  <!-- CC Box -->
  <rect x="992" y="805" width="28" height="42" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <text x="1006" y="822" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>
  <text x="1006" y="838" font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>

  <!-- On-Chip Controller Label -->
  <text x="915" y="695" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">ON-CHIP CAN</text>
  <text x="915" y="712" font-family="Times New Roman, serif" font-size="12" font-weight="bold" text-anchor="middle">CONTROLLER</text>
  <line x1="950" y1="718" x2="995" y2="800" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-blk)"/>

  <!-- MCP2551 Transceiver -->
  <rect x="790" y="750" width="125" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="852" y="783" font-family="Times New Roman, serif" font-size="16" font-weight="bold" text-anchor="middle">MCP2551</text>
  <line x1="915" y1="768" x2="990" y2="815" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>
  <line x1="990" y1="835" x2="917" y2="788" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

  <!-- Transceiver to CAN Bus Drop Lines -->
  <line x1="830" y1="750" x2="830" y2="440" stroke="#cc0000" stroke-width="1.8"/>
  <line x1="860" y1="750" x2="860" y2="510" stroke="#cc0000" stroke-width="1.8"/>

  <!-- ADC Block -->
  <rect x="1075" y="625" width="28" height="60" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <g font-family="Times New Roman, serif" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="1089" y="643">A</text><text x="1089" y="661">D</text><text x="1089" y="679">C</text>
  </g>

  <!-- FUEL GAUGE (Input to ADC) -->
  <rect x="1195" y="628" width="95" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="1242" y="650" font-family="Times New Roman, serif" font-size="15" font-weight="bold" text-anchor="middle">FUEL</text>
  <text x="1242" y="669" font-family="Times New Roman, serif" font-size="15" font-weight="bold" text-anchor="middle">GAUGE</text>
  <line x1="1195" y1="655" x2="1105" y2="655" stroke="#000" stroke-width="1.8" marker-end="url(#arrow-blk)"/>

</svg>
